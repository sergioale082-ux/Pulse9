                          if (tab == 4 && group != null) Opt("Remover desta playlist") {
                              val g = group!!; val ids = selItems.map { it.mediaId }.toSet()
                              savePls(playlists + (g to playlists[g].orEmpty().filter { it !in ids })); selMore = false; selected = emptySet()
                          }
                          Opt("Selecionar todas") { selected = shown.map { it.mediaId }.toSet(); selMore = false }
                      }
                  }
                  delPl?.let { n ->
                      Dlg("Excluir playlist?", { delPl = null }, confirm = {
                          TextButton(onClick = { savePls(playlists - n); delPl = null }) { Text("Excluir", color = Color(0xFFFF6B6B)) }
                      }) { Text("A playlist \"$n\" será apagada. As músicas continuam no celular.", color = Mut) }
                  }
                  delFor?.let { l ->
                      Dlg(if (l.size == 1) "Excluir permanente?" else "Excluir ${l.size} músicas?", { delFor = null }, confirm = {
                          TextButton(onClick = { doDelete(l); delFor = null }) { Text("Excluir", color = Color(0xFFFF6B6B)) }
                      }) { Text(if (l.size == 1) "\"${l[0].mediaMetadata.title}\" será apagada do celular. Não dá para desfazer." else "Essas músicas serão apagadas do celular. Não dá para desfazer.", color = Mut) }
                  }
                  pickMany?.let { l ->
                      Dlg("Adicionar à playlist", { pickMany = null }) {
                          Column {
                              playlists.keys.forEach { n -> Opt(n) { addManyToPl(n, l); pickMany = null; selected = emptySet() } }
                              Opt("＋ Nova playlist") { pendingMany = l; nameDlg = true; pickMany = null }
                          }
                      }
                  }
                  if (nameDlg) {
                      var txt by remember { mutableStateOf("") }
                      Dlg("Nova playlist", { nameDlg = false; pendingSong = null }, confirm = {
                          TextButton(onClick = {
                              val n = txt.trim()
                              if (n.isNotEmpty() && n !in playlists) {
                                  val first: List<String> = pendingSong?.let { listOf(it.mediaId) } ?: pendingMany?.map { it.mediaId } ?: emptyList()
                                  savePls(playlists + (n to first))
                              }
                              nameDlg = false; pendingSong = null; pendingMany = null; selected = emptySet()
                          }) { Text("Criar", color = Teal) }
                      }) {
                          OutlinedTextField(txt, { txt = it }, singleLine = true, placeholder = { Text("Nome da playlist") })
                      }
                  }
              }
          }
