      - name: Fonte (opcional)
        run: |
          mkdir -p app/src/main/res/font
          if [ -f fonts/inquisition.ttf ]; then cp fonts/inquisition.ttf app/src/main/res/font/inquisition.ttf; fi
          if [ -f fonts/inquisition.otf ]; then cp fonts/inquisition.otf app/src/main/res/font/inquisition.otf; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Player-v4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
