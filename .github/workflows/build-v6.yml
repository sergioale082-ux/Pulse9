name: Build APK v2
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar projeto
        run: |
          mkdir -p app
          cat > app/build.gradle.kts <<'__EOF__'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.player.music"
              compileSdk = 34
              defaultConfig { applicationId = "com.player.music.v2"; minSdk = 26; targetSdk = 34; versionCode = 3; versionName = "3.2" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.media3:media3-exoplayer:1.4.1")
              implementation("androidx.media3:media3-session:1.4.1")
          }
          __EOF__
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'__EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.WRITE_SETTINGS"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <application android:label="Lindoso play" android:icon="@mipmap/ic_launcher" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".PlaybackService" android:exported="true" android:foregroundServiceType="mediaPlayback">
                      <intent-filter><action android:name="androidx.media3.session.MediaSessionService"/></intent-filter>
                  </service>
              </application>
          </manifest>
          __EOF__
          mkdir -p app/src/main/java/com/player/music
          cat > app/src/main/java/com/player/music/MainActivity.kt <<'__EOF__'
          package com.player.music

          import android.Manifest
          import android.content.ComponentName
          import android.content.Context
          import android.content.ContentUris
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.widget.Toast
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.ui.geometry.CornerRadius
          import androidx.compose.ui.graphics.drawscope.rotate
          import android.app.Activity
          import android.content.Intent
          import android.media.RingtoneManager
          import android.provider.Settings
          import androidx.activity.result.IntentSenderRequest
          import androidx.compose.foundation.ExperimentalFoundationApi
          import androidx.compose.foundation.combinedClickable
          import androidx.compose.ui.res.painterResource
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.interaction.MutableInteractionSource
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.lazy.itemsIndexed
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.geometry.Size
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.ImageBitmap
          import androidx.compose.ui.graphics.Path
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.Font
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.content.ContextCompat
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MediaMetadata
          import androidx.media3.common.Player
          import androidx.media3.common.Timeline
          import androidx.media3.session.MediaController
          import androidx.media3.session.SessionToken
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.withContext

          private val Bg: Color get() = if (isDark) Color(0xFF000000) else Color(0xFFF6F8FA)
          private val Surf: Color get() = if (isDark) Color(0xFF0D0D0F) else Color(0xFFE6ECF1)
          private val Blue = Color(0xFF2158A8)
          private val Teal: Color get() = if (isDark) Color(0xFF14D6CB) else Color(0xFF0B8E88)
          private val Fg: Color get() = if (isDark) Color.White else Color(0xFF0B1220)
          private var isDark by mutableStateOf(true)
          private var themeMode by mutableStateOf(2)
          private val Mut: Color get() = if (isDark) Color(0xFF8A94A3) else Color(0xFF5B6675)
          private val Grad = Brush.horizontalGradient(listOf(Blue, Teal))
          private val artCache = android.util.LruCache<String, Bitmap>(120)
          private val dates = HashMap<String, Long>()

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  applyTheme(this, getSharedPreferences("player_v2", Context.MODE_PRIVATE).getInt("theme", 2))
                  setContent {
                      MaterialTheme(colorScheme = if (isDark) darkColorScheme(primary = Teal, onPrimary = Color.Black, background = Bg, surface = Surf) else lightColorScheme(primary = Teal, onPrimary = Color.White, background = Bg, surface = Surf)) {
                          Surface(Modifier.fillMaxSize(), color = Bg) { PlayerApp() }
                      }
                  }
              }
          }

          fun applyTheme(ctx: Context, mode: Int) {
              themeMode = mode
              val night = android.content.res.Configuration.UI_MODE_NIGHT_MASK
              isDark = when (mode) { 1 -> false; 2 -> true; else -> (ctx.resources.configuration.uiMode and night) == android.content.res.Configuration.UI_MODE_NIGHT_YES }
          }

          @Composable
          fun Gear(s: Dp) {
              Canvas(Modifier.size(s)) {
                  val c = center
                  val r = size.minDimension / 2f
                  for (i in 0 until 8) rotate(i * 45f, c) {
                      drawRoundRect(Grad, Offset(c.x - r * 0.14f, c.y - r), Size(r * 0.28f, r * 0.42f), CornerRadius(r * 0.05f))
                  }
                  drawCircle(Grad, r * 0.72f, c)
                  drawCircle(Bg, r * 0.32f, c)
              }
          }

          @Composable
          fun Act(icon: String, label: String, color: Color, click: () -> Unit) {
              Column(Modifier.clip(RoundedCornerShape(12.dp)).clickable(onClick = click).padding(horizontal = 6.dp, vertical = 4.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                  Text(icon, color = color, fontSize = 20.sp)
                  Text(label, color = color, fontSize = 10.sp, maxLines = 1)
              }
          }

          fun loadSongs(ctx: Context, minMs: Long = 0L): List<MediaItem> {
              val out = ArrayList<MediaItem>()
              val base = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
              val proj = arrayOf(MediaStore.Audio.Media._ID, MediaStore.Audio.Media.TITLE, MediaStore.Audio.Media.ARTIST, MediaStore.Audio.Media.ALBUM, MediaStore.Audio.Media.ALBUM_ID, MediaStore.Audio.Media.DATE_ADDED, MediaStore.Audio.Media.DISPLAY_NAME, MediaStore.Audio.Media.MIME_TYPE, MediaStore.Audio.Media.DATA, MediaStore.Audio.Media.DURATION)
              ctx.contentResolver.query(base, proj, "${MediaStore.Audio.Media.IS_MUSIC} != 0", null, "${MediaStore.Audio.Media.TITLE} COLLATE NOCASE ASC")?.use { c ->
                  while (c.moveToNext()) {
                      val nm = (c.getString(6) ?: "").lowercase(); val mt = (c.getString(7) ?: "").lowercase(); val pa = (c.getString(8) ?: "").lowercase()
                      if (nm.endsWith(".opus") || nm.endsWith(".ogg") || mt.contains("ogg") || mt.contains("opus") || pa.contains("voice notes")) continue
                      if (minMs > 0 && c.getLong(9) < minMs) continue
                      val id = c.getLong(0)
                      dates[id.toString()] = c.getLong(5)
                      val artist = c.getString(2)?.takeIf { it != "<unknown>" } ?: "Artista desconhecido"
                      val art = ContentUris.withAppendedId(Uri.parse("content://media/external/audio/albumart"), c.getLong(4))
                      out.add(
                          MediaItem.Builder()
                              .setMediaId(id.toString())
                              .setUri(ContentUris.withAppendedId(base, id))
                              .setMediaMetadata(MediaMetadata.Builder().setTitle(c.getString(1)).setArtist(artist).setAlbumTitle(c.getString(3)).setArtworkUri(art).build())
                              .build()
                      )
                  }
              }
              return out
          }

          fun keyOf(m: MediaItem, album: Boolean): String =
              (if (album) m.mediaMetadata.albumTitle else m.mediaMetadata.artist)?.toString() ?: "Desconhecido"

          fun fmt(ms: Long): String {
              val s = (ms / 1000).coerceAtLeast(0)
              return "%d:%02d".format(s / 60, s % 60)
          }

          fun loadPls(p: SharedPreferences): Map<String, List<String>> {
              val names = (p.getString("pl_names", "") ?: "").split("\n").filter { it.isNotBlank() }
              return names.associateWith { n -> (p.getString("pl_$n", "") ?: "").split(",").filter { it.isNotBlank() } }
          }

          suspend fun loadArt(ctx: Context, mi: MediaItem, px: Int): ImageBitmap? = withContext(Dispatchers.IO) {
              val key = mi.mediaId + "_" + px
              val hit = artCache.get(key)
              if (hit != null) return@withContext hit.asImageBitmap()
              val bmp: Bitmap? = try {
                  if (Build.VERSION.SDK_INT >= 29) {
                      ctx.contentResolver.loadThumbnail(mi.localConfiguration!!.uri, android.util.Size(px, px), null)
                  } else {
                      mi.mediaMetadata.artworkUri?.let { u -> ctx.contentResolver.openInputStream(u)?.use { BitmapFactory.decodeStream(it) } }
                  }
              } catch (e: Exception) { null }
              if (bmp != null) artCache.put(key, bmp)
              bmp?.asImageBitmap()
          }

          @Composable
          fun Logo(s: Dp) {
              Image(painterResource(R.drawable.app_logo), null, Modifier.size(s))
          }

          @Composable
          fun Ico(kind: Int, color: Color, s: Dp) {
              Canvas(Modifier.size(s)) {
                  val w = size.width
                  val h = size.height
                  when (kind) {
                      0 -> drawPath(Path().apply { moveTo(0.2f * w, 0.1f * h); lineTo(0.95f * w, 0.5f * h); lineTo(0.2f * w, 0.9f * h); close() }, color)
                      1 -> {
                          drawRect(color, Offset(0.15f * w, 0.1f * h), Size(0.25f * w, 0.8f * h))
                          drawRect(color, Offset(0.6f * w, 0.1f * h), Size(0.25f * w, 0.8f * h))
                      }
                      2 -> {
                          drawPath(Path().apply { moveTo(0.1f * w, 0.15f * h); lineTo(0.75f * w, 0.5f * h); lineTo(0.1f * w, 0.85f * h); close() }, color)
                          drawRect(color, Offset(0.8f * w, 0.15f * h), Size(0.12f * w, 0.7f * h))
                      }
                      3 -> {
                          drawPath(Path().apply { moveTo(0.9f * w, 0.15f * h); lineTo(0.25f * w, 0.5f * h); lineTo(0.9f * w, 0.85f * h); close() }, color)
                          drawRect(color, Offset(0.08f * w, 0.15f * h), Size(0.12f * w, 0.7f * h))
                      }
                      else -> {
                          drawRect(color, Offset(0.1f * w, 0.18f * h), Size(0.8f * w, 0.12f * h))
                          drawRect(color, Offset(0.1f * w, 0.44f * h), Size(0.8f * w, 0.12f * h))
                          drawRect(color, Offset(0.1f * w, 0.70f * h), Size(0.5f * w, 0.12f * h))
                      }
                  }
              }
          }

          @Composable
          fun Heart(on: Boolean, s: Dp) {
              Canvas(Modifier.size(s)) {
                  val w = size.width
                  val h = size.height
                  val p = Path().apply {
                      moveTo(0.5f * w, 0.9f * h)
                      cubicTo(0.02f * w, 0.55f * h, 0.1f * w, 0.1f * h, 0.5f * w, 0.32f * h)
                      cubicTo(0.9f * w, 0.1f * h, 0.98f * w, 0.55f * h, 0.5f * w, 0.9f * h)
                      close()
                  }
                  if (on) drawPath(p, Teal) else drawPath(p, Mut, style = Stroke(width = 0.09f * w))
              }
          }

          @Composable
          fun Art(mi: MediaItem?, s: Dp, px: Int, radius: Dp) {
              val ctx = LocalContext.current
              val bmp by produceState<ImageBitmap?>(null, mi?.mediaId) { value = if (mi == null) null else loadArt(ctx, mi, px) }
              Box(Modifier.size(s).clip(RoundedCornerShape(radius)).background(Surf), contentAlignment = Alignment.Center) {
                  val b = bmp
                  if (b != null) Image(b, null, Modifier.fillMaxSize(), contentScale = ContentScale.Crop)
                  else Logo(s * 0.5f)
              }
          }

          @Composable
          fun Chip(text: String, on: Boolean, click: () -> Unit) {
              Box(Modifier.clip(RoundedCornerShape(20.dp)).background(if (on) Teal.copy(alpha = 0.18f) else Surf).clickable(onClick = click).padding(14.dp, 8.dp)) {
                  Text(text, color = if (on) Teal else Mut, fontSize = 13.sp, fontWeight = FontWeight.Medium)
              }
          }

          @Composable
          fun Opt(t: String, c: () -> Unit) {
              Text(t, color = Fg, fontSize = 16.sp, modifier = Modifier.fillMaxWidth().clickable(onClick = c).padding(vertical = 12.dp))
          }

          @Composable
          fun Dlg(title: String, onClose: () -> Unit, confirm: @Composable () -> Unit = {}, body: @Composable () -> Unit) {
              AlertDialog(
                  onDismissRequest = onClose, containerColor = Surf,
                  title = { Text(title, color = Fg, maxLines = 1, overflow = TextOverflow.Ellipsis) },
                  text = body, confirmButton = confirm,
                  dismissButton = { TextButton(onClick = onClose) { Text("Cancelar", color = Mut) } }
              )
          }

          @Composable
          fun Overlay(center: Boolean = false, content: @Composable ColumnScope.() -> Unit) {
              Column(
                  Modifier.fillMaxSize().background(Bg)
                      .clickable(interactionSource = remember { MutableInteractionSource() }, indication = null) {}
                      .padding(20.dp),
                  horizontalAlignment = if (center) Alignment.CenterHorizontally else Alignment.Start,
                  content = content
              )
          }

          @OptIn(ExperimentalFoundationApi::class)
          @Composable
          fun PlayerApp() {
              val ctx = LocalContext.current
              val brand = remember {
                  val id = ctx.resources.getIdentifier("inquisition", "font", ctx.packageName)
                  if (id != 0) FontFamily(Font(id)) else FontFamily.Serif
              }
              var items by remember { mutableStateOf<List<MediaItem>>(emptyList()) }
              var granted by remember { mutableStateOf(false) }
              var ctrl by remember { mutableStateOf<MediaController?>(null) }
              var playing by remember { mutableStateOf(false) }
              var curId by remember { mutableStateOf<String?>(null) }
              var curIdx by remember { mutableStateOf(0) }
              var qVer by remember { mutableStateOf(0) }
              var shuffle by remember { mutableStateOf(false) }
              var repeat by remember { mutableStateOf(Player.REPEAT_MODE_OFF) }
              var query by remember { mutableStateOf("") }
              var tab by remember { mutableStateOf(0) }
              var sort by remember { mutableStateOf(0) }
              var group by remember { mutableStateOf<String?>(null) }
              var overlay by remember { mutableStateOf(0) } // 1 player, 2 fila, 3 equalizador
              var pos by remember { mutableStateOf(0L) }
              var dur by remember { mutableStateOf(0L) }
              var seeking by remember { mutableStateOf(false) }
              var speed by remember { mutableStateOf(1f) }
              var sleepMin by remember { mutableStateOf(0) }
              var menuFor by remember { mutableStateOf<MediaItem?>(null) }
              var pickFor by remember { mutableStateOf<MediaItem?>(null) }
              var nameDlg by remember { mutableStateOf(false) }
              var pendingSong by remember { mutableStateOf<MediaItem?>(null) }
              var selected by remember { mutableStateOf<Set<String>>(emptySet()) }
              var topMenu by remember { mutableStateOf(false) }
              var delFor by remember { mutableStateOf<List<MediaItem>?>(null) }
              var pickMany by remember { mutableStateOf<List<MediaItem>?>(null) }
              var pendingMany by remember { mutableStateOf<List<MediaItem>?>(null) }
              var pendingDel by remember { mutableStateOf<List<MediaItem>>(emptyList()) }
              val prefs = remember { ctx.getSharedPreferences("player_v2", Context.MODE_PRIVATE) }
              var favs by remember { mutableStateOf(prefs.getStringSet("favs", emptySet())!!.toSet()) }
              var playlists by remember { mutableStateOf(loadPls(prefs)) }
              var minSec by remember { mutableStateOf(prefs.getInt("min_sec", 0)) }
              var reloadKey by remember { mutableStateOf(0) }
              var delPl by remember { mutableStateOf<String?>(null) }
              var selMore by remember { mutableStateOf(false) }

              fun toggleFav(id: String) {
                  favs = if (id in favs) favs - id else favs + id
                  prefs.edit().putStringSet("favs", favs).apply()
              }
              fun savePls(m: Map<String, List<String>>) {
                  playlists = m
                  val e = prefs.edit()
                  e.putString("pl_names", m.keys.joinToString("\n"))
                  m.forEach { (k, v) -> e.putString("pl_$k", v.joinToString(",")) }
                  e.apply()
              }
              fun toast(t: String) { Toast.makeText(ctx, t, Toast.LENGTH_SHORT).show() }

              val perms = if (Build.VERSION.SDK_INT >= 33)
                  arrayOf(Manifest.permission.READ_MEDIA_AUDIO, Manifest.permission.POST_NOTIFICATIONS)
              else arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE)
              val launcher = rememberLauncherForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { r ->
                  granted = r[perms[0]] == true
              }
              LaunchedEffect(Unit) {
                  EqHolder.enabled = prefs.getBoolean("eq_on", false)
                  EqHolder.levels = (prefs.getString("eq_levels", "") ?: "").split(",").mapNotNull { it.toIntOrNull() }.toIntArray()
                  EqHolder.apply()
                  granted = ContextCompat.checkSelfPermission(ctx, perms[0]) == PackageManager.PERMISSION_GRANTED
                  if (!granted) launcher.launch(perms)
              }
              LaunchedEffect(granted, minSec, reloadKey) { if (granted) items = withContext(Dispatchers.IO) { loadSongs(ctx, minSec * 1000L) } }

              DisposableEffect(Unit) {
                  val future = MediaController.Builder(ctx, SessionToken(ctx, ComponentName(ctx, PlaybackService::class.java))).buildAsync()
                  val listener = object : Player.Listener {
                      override fun onIsPlayingChanged(isPlaying: Boolean) { playing = isPlaying }
                      override fun onMediaItemTransition(mediaItem: MediaItem?, reason: Int) {
                          curId = mediaItem?.mediaId
                          curIdx = ctrl?.currentMediaItemIndex ?: 0
                      }
                      override fun onTimelineChanged(timeline: Timeline, reason: Int) {
                          qVer++
                          curIdx = ctrl?.currentMediaItemIndex ?: 0
                      }
                      override fun onShuffleModeEnabledChanged(enabled: Boolean) { shuffle = enabled }
                      override fun onRepeatModeChanged(mode: Int) { repeat = mode }
                  }
                  future.addListener({
                      val c = future.get()
                      ctrl = c
                      c.addListener(listener)
                      playing = c.isPlaying; curId = c.currentMediaItem?.mediaId; curIdx = c.currentMediaItemIndex
                      shuffle = c.shuffleModeEnabled; repeat = c.repeatMode; qVer++
                  }, ContextCompat.getMainExecutor(ctx))
                  onDispose { ctrl?.removeListener(listener); MediaController.releaseFuture(future) }
              }

              LaunchedEffect(ctrl) {
                  while (true) {
                      val c = ctrl
                      if (c != null && !seeking) { pos = c.currentPosition; dur = c.duration.coerceAtLeast(0L) }
                      delay(400)
                  }
              }
              LaunchedEffect(sleepMin) {
                  if (sleepMin > 0) { delay(sleepMin * 60_000L); ctrl?.pause(); sleepMin = 0 }
              }

              val byId = remember(items) { items.associateBy { it.mediaId } }
              val shown = remember(items, favs, tab, group, query, sort, playlists) {
                  val base = when {
                      tab == 3 -> items.filter { it.mediaId in favs }
                      tab == 4 -> playlists[group].orEmpty().mapNotNull { byId[it] }
                      group != null -> items.filter { keyOf(it, tab == 1) == group }
                      else -> items
                  }
                  val f = if (query.isBlank()) base
                  else base.filter { "${it.mediaMetadata.title} ${it.mediaMetadata.artist} ${it.mediaMetadata.albumTitle}".contains(query, true) }
                  when {
                      tab == 4 -> f
                      sort == 1 -> f.sortedBy { it.mediaMetadata.artist?.toString()?.lowercase() ?: "" }
                      sort == 2 -> f.sortedByDescending { dates[it.mediaId] ?: 0L }
                      else -> f
                  }
              }
              val groups = remember(items, tab, query) {
                  items.groupBy { keyOf(it, tab == 1) }
                      .filter { query.isBlank() || it.key.contains(query, true) }
                      .toList().sortedBy { it.first.lowercase() }
              }
              val current = items.firstOrNull { it.mediaId == curId }

              fun playFrom(list: List<MediaItem>, id: String) {
                  val c = ctrl ?: return
                  if (c.currentMediaItem?.mediaId == id) { if (!c.isPlaying) c.play() }
                  else {
                      c.setMediaItems(list, list.indexOfFirst { it.mediaId == id }.coerceAtLeast(0), 0L)
                      c.prepare(); c.play()
                  }
              }
              fun enqueue(m: MediaItem, next: Boolean) {
                  val c = ctrl ?: return
                  if (c.mediaItemCount == 0) { c.setMediaItems(listOf(m)); c.prepare() }
                  else c.addMediaItem(if (next) c.currentMediaItemIndex + 1 else c.mediaItemCount, m)
                  toast(if (next) "Toca a seguir" else "Adicionada à fila")
              }
              fun addToPl(n: String, m: MediaItem) {
                  val l = playlists[n].orEmpty()
                  if (m.mediaId !in l) savePls(playlists + (n to (l + m.mediaId)))
                  toast("Adicionada a $n")
              }
              val toggle = { ctrl?.let { if (it.isPlaying) it.pause() else it.play() }; Unit }
              fun uriOf(m: MediaItem): Uri = m.localConfiguration!!.uri
              fun share(list: List<MediaItem>) {
                  val i = if (list.size == 1) Intent(Intent.ACTION_SEND).putExtra(Intent.EXTRA_STREAM, uriOf(list[0]))
                  else Intent(Intent.ACTION_SEND_MULTIPLE).putParcelableArrayListExtra(Intent.EXTRA_STREAM, ArrayList(list.map { uriOf(it) }))
                  i.type = "audio/*"; i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  ctx.startActivity(Intent.createChooser(i, "Compartilhar").addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
              }
              fun setRingtone(m: MediaItem) {
                  if (!Settings.System.canWrite(ctx)) {
                      toast("Permita \"Modificar configurações do sistema\" e toque de novo")
                      ctx.startActivity(Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS, Uri.parse("package:${ctx.packageName}")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      return
                  }
                  try { RingtoneManager.setActualDefaultRingtoneUri(ctx, RingtoneManager.TYPE_RINGTONE, uriOf(m)); toast("Toque definido") }
                  catch (e: Exception) { toast("Não foi possível definir o toque") }
              }
              fun afterDelete(list: List<MediaItem>) {
                  val ids = list.map { it.mediaId }.toSet()
                  items = items.filterNot { it.mediaId in ids }
                  selected = emptySet()
                  ctrl?.let { c -> for (i in c.mediaItemCount - 1 downTo 0) if (c.getMediaItemAt(i).mediaId in ids) c.removeMediaItem(i) }
                  toast("Excluída")
              }
              val delLauncher = rememberLauncherForActivityResult(ActivityResultContracts.StartIntentSenderForResult()) { r ->
                  if (r.resultCode == Activity.RESULT_OK) afterDelete(pendingDel)
              }
              fun doDelete(list: List<MediaItem>) {
                  pendingDel = list
                  try {
                      if (Build.VERSION.SDK_INT >= 30) {
                          val pi = MediaStore.createDeleteRequest(ctx.contentResolver, list.map { uriOf(it) })
                          delLauncher.launch(IntentSenderRequest.Builder(pi.intentSender).build())
                      } else {
                          list.forEach { ctx.contentResolver.delete(uriOf(it), null, null) }
                          afterDelete(list)
                      }
                  } catch (e: Exception) { toast("Não foi possível excluir") }
              }
