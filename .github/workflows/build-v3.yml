name: Build APK v2
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Criar projeto
        run: |
          mkdir -p .
          cat > settings.gradle.kts <<'__EOF__'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Player"
          include(":app")
          __EOF__
          mkdir -p .
          cat > build.gradle.kts <<'__EOF__'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          __EOF__
          mkdir -p .
          cat > gradle.properties <<'__EOF__'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          __EOF__
          mkdir -p app
          cat > app/build.gradle.kts <<'__EOF__'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.player.music"
              compileSdk = 34
              defaultConfig { applicationId = "com.player.music.v2"; minSdk = 26; targetSdk = 34; versionCode = 1; versionName = "2.0" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.media3:media3-exoplayer:1.4.1")
              implementation("androidx.media3:media3-session:1.4.1")
          }
          __EOF__
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'__EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <application android:label="Player Plus" android:icon="@mipmap/ic_launcher" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".PlaybackService" android:exported="true" android:foregroundServiceType="mediaPlayback">
                      <intent-filter><action android:name="androidx.media3.session.MediaSessionService"/></intent-filter>
                  </service>
              </application>
          </manifest>
          __EOF__
          mkdir -p app/src/main/java/com/player/music
          cat > app/src/main/java/com/player/music/PlaybackService.kt <<'__EOF__'
          package com.player.music

          import androidx.media3.common.AudioAttributes
          import androidx.media3.common.C
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.session.MediaSession
          import androidx.media3.session.MediaSessionService

          class PlaybackService : MediaSessionService() {
              private var session: MediaSession? = null

              override fun onCreate() {
                  super.onCreate()
                  val player = ExoPlayer.Builder(this)
                      .setAudioAttributes(AudioAttributes.Builder().setContentType(C.AUDIO_CONTENT_TYPE_MUSIC).setUsage(C.USAGE_MEDIA).build(), true)
                      .setHandleAudioBecomingNoisy(true)
                      .setWakeMode(C.WAKE_MODE_LOCAL)
                      .build()
                  session = MediaSession.Builder(this, player).build()
              }

              override fun onGetSession(controllerInfo: MediaSession.ControllerInfo): MediaSession? = session

              override fun onDestroy() {
                  session?.run { player.release(); release() }
                  session = null
                  super.onDestroy()
              }
          }
          __EOF__
          mkdir -p app/src/main/java/com/player/music
          cat > app/src/main/java/com/player/music/MainActivity.kt <<'__EOF__'
          package com.player.music

          import android.Manifest
          import android.content.ComponentName
          import android.content.Context
          import android.content.ContentUris
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.geometry.Size
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.ImageBitmap
          import androidx.compose.ui.graphics.Path
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.content.ContextCompat
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MediaMetadata
          import androidx.media3.common.Player
          import androidx.media3.session.MediaController
          import androidx.media3.session.SessionToken
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.withContext

          private val Bg = Color(0xFF07090D)
          private val Surf = Color(0xFF11161D)
          private val Blue = Color(0xFF2158A8)
          private val Teal = Color(0xFF08B3AE)
          private val Mut = Color(0xFF8A94A3)
          private val Grad = Brush.horizontalGradient(listOf(Blue, Teal))
          private val artCache = android.util.LruCache<String, Bitmap>(120)

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme(primary = Teal, onPrimary = Color.Black, background = Bg, surface = Surf)) {
                          Surface(Modifier.fillMaxSize(), color = Bg) { PlayerApp() }
                      }
                  }
              }
          }

          fun loadSongs(ctx: Context): List<MediaItem> {
              val out = ArrayList<MediaItem>()
              val base = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
              val proj = arrayOf(MediaStore.Audio.Media._ID, MediaStore.Audio.Media.TITLE, MediaStore.Audio.Media.ARTIST, MediaStore.Audio.Media.ALBUM, MediaStore.Audio.Media.ALBUM_ID)
              ctx.contentResolver.query(base, proj, "${MediaStore.Audio.Media.IS_MUSIC} != 0", null, "${MediaStore.Audio.Media.TITLE} COLLATE NOCASE ASC")?.use { c ->
                  while (c.moveToNext()) {
                      val id = c.getLong(0)
                      val artist = c.getString(2)?.takeIf { it != "<unknown>" } ?: "Artista desconhecido"
                      val art = ContentUris.withAppendedId(Uri.parse("content://media/external/audio/albumart"), c.getLong(4))
                      out.add(
                          MediaItem.Builder()
                              .setMediaId(id.toString())
                              .setUri(ContentUris.withAppendedId(base, id))
                              .setMediaMetadata(MediaMetadata.Builder().setTitle(c.getString(1)).setArtist(artist).setAlbumTitle(c.getString(3)).setArtworkUri(art).build())
                              .build()
                      )
                  }
              }
              return out
          }

          fun keyOf(m: MediaItem, album: Boolean): String =
              (if (album) m.mediaMetadata.albumTitle else m.mediaMetadata.artist)?.toString() ?: "Desconhecido"

          fun fmt(ms: Long): String {
              val s = (ms / 1000).coerceAtLeast(0)
              return "%d:%02d".format(s / 60, s % 60)
          }

          suspend fun loadArt(ctx: Context, mi: MediaItem, px: Int): ImageBitmap? = withContext(Dispatchers.IO) {
              val key = mi.mediaId + "_" + px
              val hit = artCache.get(key)
              if (hit != null) return@withContext hit.asImageBitmap()
              val bmp: Bitmap? = try {
                  if (Build.VERSION.SDK_INT >= 29) {
                      ctx.contentResolver.loadThumbnail(mi.localConfiguration!!.uri, android.util.Size(px, px), null)
                  } else {
                      mi.mediaMetadata.artworkUri?.let { u -> ctx.contentResolver.openInputStream(u)?.use { BitmapFactory.decodeStream(it) } }
                  }
              } catch (e: Exception) { null }
              if (bmp != null) artCache.put(key, bmp)
              bmp?.asImageBitmap()
          }

          @Composable
          fun Logo(s: Dp) {
              Canvas(Modifier.size(s)) {
                  val w = size.width
                  val h = size.height
                  val tri = Path().apply {
                      moveTo(0.12f * w, 0.05f * h); lineTo(0.95f * w, 0.5f * h); lineTo(0.12f * w, 0.95f * h); close()
                  }
                  drawPath(tri, Brush.horizontalGradient(listOf(Blue, Teal), startX = 0.12f * w, endX = 0.95f * w))
                  val facet = Path().apply {
                      moveTo(0.12f * w, 0.257f * h); lineTo(0.587f * w, 0.689f * h); lineTo(0.12f * w, 0.95f * h); close()
                  }
                  drawPath(facet, Color(0x661F55A8))
              }
          }

          @Composable
          fun Ico(kind: Int, color: Color, s: Dp) {
              Canvas(Modifier.size(s)) {
                  val w = size.width
                  val h = size.height
                  when (kind) {
                      0 -> drawPath(Path().apply { moveTo(0.2f * w, 0.1f * h); lineTo(0.95f * w, 0.5f * h); lineTo(0.2f * w, 0.9f * h); close() }, color)
                      1 -> {
                          drawRect(color, Offset(0.15f * w, 0.1f * h), Size(0.25f * w, 0.8f * h))
                          drawRect(color, Offset(0.6f * w, 0.1f * h), Size(0.25f * w, 0.8f * h))
                      }
                      2 -> {
                          drawPath(Path().apply { moveTo(0.1f * w, 0.15f * h); lineTo(0.75f * w, 0.5f * h); lineTo(0.1f * w, 0.85f * h); close() }, color)
                          drawRect(color, Offset(0.8f * w, 0.15f * h), Size(0.12f * w, 0.7f * h))
                      }
                      else -> {
                          drawPath(Path().apply { moveTo(0.9f * w, 0.15f * h); lineTo(0.25f * w, 0.5f * h); lineTo(0.9f * w, 0.85f * h); close() }, color)
                          drawRect(color, Offset(0.08f * w, 0.15f * h), Size(0.12f * w, 0.7f * h))
                      }
                  }
              }
          }

          @Composable
          fun Art(mi: MediaItem?, s: Dp, px: Int, radius: Dp) {
              val ctx = LocalContext.current
              val bmp by produceState<ImageBitmap?>(null, mi?.mediaId) { value = if (mi == null) null else loadArt(ctx, mi, px) }
              Box(Modifier.size(s).clip(RoundedCornerShape(radius)).background(Surf), contentAlignment = Alignment.Center) {
                  val b = bmp
                  if (b != null) Image(b, null, Modifier.fillMaxSize(), contentScale = ContentScale.Crop)
                  else Logo(s * 0.5f)
              }
          }

          @Composable
          fun Chip(text: String, on: Boolean, click: () -> Unit) {
              Box(Modifier.clip(RoundedCornerShape(20.dp)).background(if (on) Teal.copy(alpha = 0.18f) else Surf).clickable(onClick = click).padding(14.dp, 8.dp)) {
                  Text(text, color = if (on) Teal else Mut, fontSize = 13.sp, fontWeight = FontWeight.Medium)
              }
          }

          @Composable
          fun PlayerApp() {
              val ctx = LocalContext.current
              var items by remember { mutableStateOf<List<MediaItem>>(emptyList()) }
              var granted by remember { mutableStateOf(false) }
              var ctrl by remember { mutableStateOf<MediaController?>(null) }
              var playing by remember { mutableStateOf(false) }
              var curId by remember { mutableStateOf<String?>(null) }
              var shuffle by remember { mutableStateOf(false) }
              var repeat by remember { mutableStateOf(Player.REPEAT_MODE_OFF) }
              var query by remember { mutableStateOf("") }
              var tab by remember { mutableStateOf(0) }
              var group by remember { mutableStateOf<String?>(null) }
              var expanded by remember { mutableStateOf(false) }
              var pos by remember { mutableStateOf(0L) }
              var dur by remember { mutableStateOf(0L) }
              var seeking by remember { mutableStateOf(false) }
              var speed by remember { mutableStateOf(1f) }
              var sleepMin by remember { mutableStateOf(0) }
              val prefs = remember { ctx.getSharedPreferences("player_v2", Context.MODE_PRIVATE) }
              var favs by remember { mutableStateOf(prefs.getStringSet("favs", emptySet())!!.toSet()) }

              fun toggleFav(id: String) {
                  favs = if (id in favs) favs - id else favs + id
                  prefs.edit().putStringSet("favs", favs).apply()
              }

              val perms = if (Build.VERSION.SDK_INT >= 33)
                  arrayOf(Manifest.permission.READ_MEDIA_AUDIO, Manifest.permission.POST_NOTIFICATIONS)
              else arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE)
              val launcher = rememberLauncherForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { r ->
                  granted = r[perms[0]] == true
              }
              LaunchedEffect(Unit) {
                  granted = ContextCompat.checkSelfPermission(ctx, perms[0]) == PackageManager.PERMISSION_GRANTED
                  if (!granted) launcher.launch(perms)
              }
              LaunchedEffect(granted) { if (granted) items = withContext(Dispatchers.IO) { loadSongs(ctx) } }

              DisposableEffect(Unit) {
                  val future = MediaController.Builder(ctx, SessionToken(ctx, ComponentName(ctx, PlaybackService::class.java))).buildAsync()
                  val listener = object : Player.Listener {
                      override fun onIsPlayingChanged(isPlaying: Boolean) { playing = isPlaying }
                      override fun onMediaItemTransition(mediaItem: MediaItem?, reason: Int) { curId = mediaItem?.mediaId }
                      override fun onShuffleModeEnabledChanged(enabled: Boolean) { shuffle = enabled }
                      override fun onRepeatModeChanged(mode: Int) { repeat = mode }
                  }
                  future.addListener({
                      val c = future.get()
                      ctrl = c
                      c.addListener(listener)
                      playing = c.isPlaying; curId = c.currentMediaItem?.mediaId; shuffle = c.shuffleModeEnabled; repeat = c.repeatMode
                  }, ContextCompat.getMainExecutor(ctx))
                  onDispose { ctrl?.removeListener(listener); MediaController.releaseFuture(future) }
              }

              LaunchedEffect(ctrl) {
                  while (true) {
                      val c = ctrl
                      if (c != null && !seeking) { pos = c.currentPosition; dur = c.duration.coerceAtLeast(0L) }
                      delay(400)
                  }
              }
              LaunchedEffect(sleepMin) {
                  if (sleepMin > 0) { delay(sleepMin * 60_000L); ctrl?.pause(); sleepMin = 0 }
              }

              val shown = remember(items, favs, tab, group, query) {
                  val base = when {
                      tab == 3 -> items.filter { it.mediaId in favs }
                      group != null -> items.filter { keyOf(it, tab == 1) == group }
                      else -> items
                  }
                  if (query.isBlank()) base
                  else base.filter { "${it.mediaMetadata.title} ${it.mediaMetadata.artist} ${it.mediaMetadata.albumTitle}".contains(query, true) }
              }
              val groups = remember(items, tab, query) {
                  items.groupBy { keyOf(it, tab == 1) }
                      .filter { query.isBlank() || it.key.contains(query, true) }
                      .toList().sortedBy { it.first.lowercase() }
              }
              val current = items.firstOrNull { it.mediaId == curId }

              fun playFrom(list: List<MediaItem>, id: String) {
                  val c = ctrl ?: return
                  if (c.currentMediaItem?.mediaId == id) { if (!c.isPlaying) c.play() }
                  else {
                      c.setMediaItems(list, list.indexOfFirst { it.mediaId == id }.coerceAtLeast(0), 0L)
                      c.prepare(); c.play()
                  }
              }

              Box(Modifier.fillMaxSize().background(Bg)) {
                  Column(Modifier.fillMaxSize()) {
                      Row(Modifier.fillMaxWidth().padding(20.dp, 14.dp, 20.dp, 6.dp), verticalAlignment = Alignment.CenterVertically) {
                          Logo(40.dp)
                          Spacer(Modifier.weight(1f))
                          Text("${items.size} músicas", color = Mut, fontSize = 13.sp)
                      }
                      OutlinedTextField(
                          query, { query = it }, singleLine = true, shape = RoundedCornerShape(28.dp),
                          placeholder = { Text("Buscar músicas, artistas, álbuns", color = Mut) },
                          colors = OutlinedTextFieldDefaults.colors(
                              focusedBorderColor = Teal, unfocusedBorderColor = Color.Transparent,
                              focusedContainerColor = Surf, unfocusedContainerColor = Surf
                          ),
                          modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp)
                      )
                      Row(Modifier.horizontalScroll(rememberScrollState()).padding(16.dp, 12.dp), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          listOf("Músicas", "Álbuns", "Artistas", "Favoritas").forEachIndexed { i, t ->
                              Chip(t, tab == i) { tab = i; group = null }
                          }
                      }
                      if (group != null) {
                          Text("‹  $group", color = Teal, fontWeight = FontWeight.SemiBold, modifier = Modifier.clickable { group = null }.padding(20.dp, 4.dp, 20.dp, 8.dp))
                      }
                      if (!granted) Button(onClick = { launcher.launch(perms) }, modifier = Modifier.padding(16.dp)) { Text("Permitir acesso às músicas") }
                      LazyColumn(Modifier.weight(1f), contentPadding = PaddingValues(bottom = 100.dp)) {
                          if ((tab == 1 || tab == 2) && group == null) {
                              items(groups, key = { it.first }) { g ->
                                  Row(Modifier.fillMaxWidth().clickable { group = g.first }.padding(16.dp, 8.dp), verticalAlignment = Alignment.CenterVertically) {
                                      Art(g.second.first(), 52.dp, 128, 12.dp)
                                      Spacer(Modifier.width(12.dp))
                                      Column(Modifier.weight(1f)) {
                                          Text(g.first, color = Color.White, maxLines = 1, overflow = TextOverflow.Ellipsis, fontWeight = FontWeight.SemiBold)
                                          Text("${g.second.size} músicas", color = Mut, fontSize = 13.sp)
                                      }
                                  }
                              }
                          } else {
                              if (shown.isNotEmpty()) item {
                                  Box(
                                      Modifier.padding(16.dp, 4.dp, 16.dp, 8.dp).clip(RoundedCornerShape(24.dp)).background(Grad)
                                          .clickable { ctrl?.let { it.shuffleModeEnabled = true; it.setMediaItems(shown); it.prepare(); it.play() } }
                                          .padding(20.dp, 10.dp)
                                  ) { Text("Tocar tudo aleatório", color = Color.White, fontWeight = FontWeight.SemiBold) }
                              }
                              if (shown.isEmpty()) item {
                                  Text(if (tab == 3) "Toque no coração de uma música para ela aparecer aqui." else "Nenhuma música encontrada.", color = Mut, modifier = Modifier.padding(20.dp))
                              }
                              items(shown, key = { it.mediaId }) { mi ->
                                  val on = mi.mediaId == curId
                                  Row(Modifier.fillMaxWidth().clickable { playFrom(shown, mi.mediaId) }.padding(16.dp, 8.dp), verticalAlignment = Alignment.CenterVertically) {
                                      Art(mi, 52.dp, 128, 12.dp)
                                      Spacer(Modifier.width(12.dp))
                                      Column(Modifier.weight(1f)) {
                                          Text(mi.mediaMetadata.title?.toString() ?: "", color = if (on) Teal else Color.White, maxLines = 1, overflow = TextOverflow.Ellipsis, fontWeight = FontWeight.SemiBold)
                                          Text(mi.mediaMetadata.artist?.toString() ?: "", color = Mut, fontSize = 13.sp, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                      }
                                      Text(if (mi.mediaId in favs) "♥" else "♡", color = if (mi.mediaId in favs) Teal else Mut, fontSize = 22.sp, modifier = Modifier.clickable { toggleFav(mi.mediaId) }.padding(8.dp))
                                  }
                              }
                          }
                      }
                  }

                  if (current != null && !expanded) {
                      Column(
                          Modifier.align(Alignment.BottomCenter).fillMaxWidth().padding(12.dp).clip(RoundedCornerShape(22.dp)).background(Surf).clickable { expanded = true }
                      ) {
                          Row(Modifier.padding(10.dp), verticalAlignment = Alignment.CenterVertically) {
                              Art(current, 46.dp, 128, 12.dp)
                              Column(Modifier.weight(1f).padding(horizontal = 12.dp)) {
                                  Text(current.mediaMetadata.title?.toString() ?: "", color = Color.White, maxLines = 1, overflow = TextOverflow.Ellipsis, fontWeight = FontWeight.SemiBold)
                                  Text(current.mediaMetadata.artist?.toString() ?: "", color = Mut, fontSize = 12.sp, maxLines = 1)
                              }
                              Box(Modifier.clickable { ctrl?.seekToPrevious() }.padding(10.dp)) { Ico(3, Color.White, 20.dp) }
                              Box(Modifier.clickable { ctrl?.let { if (it.isPlaying) it.pause() else it.play() } }.padding(10.dp)) { Ico(if (playing) 1 else 0, Teal, 24.dp) }
                              Box(Modifier.clickable { ctrl?.seekToNext() }.padding(10.dp)) { Ico(2, Color.White, 20.dp) }
                          }
                          Box(Modifier.fillMaxWidth().height(3.dp).background(Bg)) {
                              Box(Modifier.fillMaxWidth(if (dur > 0) (pos.toFloat() / dur).coerceIn(0f, 1f) else 0f).height(3.dp).background(Grad))
                          }
                      }
                  }

                  if (current != null && expanded) {
                      BackHandler { expanded = false }
                      Column(Modifier.fillMaxSize().background(Bg).padding(24.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                          Text("⌄  Fechar", color = Mut, modifier = Modifier.align(Alignment.Start).clickable { expanded = false }.padding(vertical = 8.dp))
                          Spacer(Modifier.height(12.dp))
                          Art(current, 300.dp, 640, 28.dp)
                          Spacer(Modifier.height(24.dp))
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Column(Modifier.weight(1f)) {
                                  Text(current.mediaMetadata.title?.toString() ?: "", color = Color.White, fontSize = 22.sp, fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                  Text(current.mediaMetadata.artist?.toString() ?: "", color = Mut, fontSize = 15.sp, maxLines = 1)
                              }
                              Text(if (current.mediaId in favs) "♥" else "♡", color = if (current.mediaId in favs) Teal else Mut, fontSize = 28.sp, modifier = Modifier.clickable { toggleFav(current.mediaId) }.padding(8.dp))
                          }
                          Slider(
                              value = if (dur > 0) (pos.toFloat() / dur).coerceIn(0f, 1f) else 0f,
                              onValueChange = { seeking = true; pos = (it * dur).toLong() },
                              onValueChangeFinished = { ctrl?.seekTo(pos); seeking = false },
                              colors = SliderDefaults.colors(thumbColor = Teal, activeTrackColor = Teal, inactiveTrackColor = Surf)
                          )
                          Row(Modifier.fillMaxWidth()) {
                              Text(fmt(pos), color = Mut, fontSize = 12.sp)
                              Spacer(Modifier.weight(1f))
                              Text(fmt(dur), color = Mut, fontSize = 12.sp)
                          }
                          Spacer(Modifier.height(16.dp))
                          Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(28.dp)) {
                              Box(Modifier.clickable { ctrl?.seekToPrevious() }.padding(8.dp)) { Ico(3, Color.White, 30.dp) }
                              Box(Modifier.size(76.dp).clip(CircleShape).background(Grad).clickable { ctrl?.let { if (it.isPlaying) it.pause() else it.play() } }, contentAlignment = Alignment.Center) {
                                  Ico(if (playing) 1 else 0, Color.White, 32.dp)
                              }
                              Box(Modifier.clickable { ctrl?.seekToNext() }.padding(8.dp)) { Ico(2, Color.White, 30.dp) }
                          }
                          Spacer(Modifier.height(24.dp))
                          Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              Chip("Aleatório", shuffle) { ctrl?.let { it.shuffleModeEnabled = !it.shuffleModeEnabled } }
                              Chip(when (repeat) { Player.REPEAT_MODE_ONE -> "Repetir uma"; Player.REPEAT_MODE_ALL -> "Repetir todas"; else -> "Repetir" }, repeat != Player.REPEAT_MODE_OFF) {
                                  ctrl?.let {
                                      it.repeatMode = when (it.repeatMode) {
                                          Player.REPEAT_MODE_OFF -> Player.REPEAT_MODE_ALL
                                          Player.REPEAT_MODE_ALL -> Player.REPEAT_MODE_ONE
                                          else -> Player.REPEAT_MODE_OFF
                                      }
                                  }
                              }
                              Chip("Velocidade ${speed}x", speed != 1f) {
                                  speed = when (speed) { 1f -> 1.25f; 1.25f -> 1.5f; 1.5f -> 2f; 2f -> 0.75f; else -> 1f }
                                  ctrl?.setPlaybackSpeed(speed)
                              }
                              Chip(if (sleepMin == 0) "Timer" else "Timer ${sleepMin} min", sleepMin != 0) {
                                  sleepMin = when (sleepMin) { 0 -> 15; 15 -> 30; 30 -> 60; else -> 0 }
                              }
                          }
                      }
                  }
              }
          }
